# Activate with: --spring.profiles.active=postgres
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

server.port=${PORT}
spring.main.lazy-initialization=true
spring.jpa.open-in-view=false
server.tomcat.threads.max=20


# Admin panel password (override with the ADMIN_PASSWORD environment variable; change it before sharing the app)
grammarmaster.admin.password=${ADMIN_PASSWORD:admin123}

# Send error messages (e.g. "Wrong password") to the frontend
server.error.include-message=always