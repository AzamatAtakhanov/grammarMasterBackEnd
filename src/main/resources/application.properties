spring.application.name=GrammarMaster
server.port=8080

# Easy local mode: H2 database (no separate database installation required)
spring.datasource.url=jdbc:h2:mem:grammarmaster;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html

# Admin panel password (override with the ADMIN_PASSWORD environment variable; change it before sharing the app)
grammarmaster.admin.password=${ADMIN_PASSWORD:admin123}

# Send error messages (e.g. "Wrong password") to the frontend
server.error.include-message=always
